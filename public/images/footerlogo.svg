<svg width="240" height="56" viewBox="0 0 240 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Housing Hub">
  <title>Housing Hub</title>

  <!-- Architectural H mark, reversed for dark backgrounds -->
  <g>
    <!-- Roofline -->
    <path d="M4 20 L23 8 L42 20"
          stroke="#FFFFFF" stroke-width="3.6"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Left pillar -->
    <rect x="8" y="20" width="8" height="28" rx="1.8" fill="#FFFFFF"/>
    <!-- Right pillar -->
    <rect x="30" y="20" width="8" height="28" rx="1.8" fill="#FFFFFF"/>
    <!-- Gold crossbeam -->
    <rect x="16" y="31" width="14" height="7" fill="#C9A227"/>
  </g>

  <!-- Wordmark -->
  <text x="56" y="29"
        font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="21" font-weight="800" fill="#FFFFFF" letter-spacing="-0.6">Housing</text>
  <text x="56" y="48"
        font-family="Montserrat, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400" fill="#C9A227" letter-spacing="4.2">HUB</text>
</svg>
